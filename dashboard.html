<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Quantity Measurement</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📏</text></svg>">
    <link rel="stylesheet" href="styles.css">
    <style>
        .dashboard-container {
            max-width: 800px;
            width: 100%;
        }
        .measurement-type-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .type-tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            background: var(--input-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }
        .type-tab.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        .type-tab:hover:not(.active) {
            background: rgba(255, 255, 255, 0.05);
        }
        
        .operations {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .op-btn {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .op-btn.active {
            background: rgba(255, 255, 255, 0.15);
            border-color: #38BDF8;
            color: #38BDF8;
        }
        .op-btn:hover:not(.active) {
            background: rgba(255, 255, 255, 0.05);
        }
        
        .quantities-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .quantity-box {
            flex: 1;
            background: rgba(15, 23, 42, 0.4);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
        }
        
        .result-box {
            margin-top: 20px;
            padding: 20px;
            background: rgba(79, 70, 229, 0.1);
            border: 1px solid rgba(79, 70, 229, 0.3);
            border-radius: 12px;
            text-align: center;
            font-size: 1.25rem;
            font-weight: 500;
            display: none;
            animation: fadeIn 0.4s ease-out forwards;
        }
        
        .error-box {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.3);
            color: #FCA5A5;
        }
    </style>
</head>
<body>
    <div class="container dashboard-container">
        <div class="header" style="margin-bottom: 1.5rem;">
            <div class="header-icon" style="margin-bottom: 0.5rem; width: 48px; height: 48px;">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                </svg>
            </div>
            <h1 class="title">Measurement Studio</h1>
        </div>

        <!-- Types -->
        <div class="measurement-type-tabs" id="typeTabs">
            <div class="type-tab active" data-type="LengthUnit">Length</div>
            <div class="type-tab" data-type="WeightUnit">Weight</div>
            <div class="type-tab" data-type="VolumeUnit">Volume</div>
            <div class="type-tab" data-type="TemperatureUnit">Temperature</div>
        </div>

        <!-- Operations -->
        <div class="operations" id="operationTabs">
            <button class="op-btn active" data-op="convert">Convert</button>
            <button class="op-btn" data-op="compare">Compare</button>
            <button class="op-btn" data-op="add">Add</button>
            <button class="op-btn" data-op="subtract">Subtract</button>
            <button class="op-btn" data-op="divide">Divide</button>
        </div>

        <div class="quantities-row">
            <!-- Q1 -->
            <div class="quantity-box">
                <label class="form-label">Quantity 1 (Source)</label>
                <div class="form-group">
                    <input type="number" id="val1" class="form-input" placeholder="0.0" step="any" required>
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <select id="unit1" class="form-input"></select>
                </div>
            </div>

            <!-- Q2 -->
            <div class="quantity-box" id="q2-box">
                <label class="form-label" id="q2-label">Quantity 2 / Target Unit</label>
                <div class="form-group" id="q2-value-group" style="display: none;">
                    <input type="number" id="val2" class="form-input" placeholder="0.0" step="any">
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <select id="unit2" class="form-input"></select>
                </div>
            </div>
        </div>

        <button class="btn" id="action-btn">Convert Quantity</button>

        <div class="result-box" id="resultBox"></div>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
