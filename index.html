<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Quantity Measurement App</title>
  <meta name="description" content="Login to Quantity Measurement App to securely measure, convert, and manage your quantities with high precision.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container" id="login-container">
    <div class="header">
      <div class="header-icon">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
        </svg>
      </div>
      <h1 class="title">Welcome Back</h1>
      <p class="subtitle">Log in to Quantity Measurement App</p>
    </div>

    <!-- Measurement themed subtle decoration -->
    <div class="measurement-icon">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>

    <form id="login-form">
      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" id="email" class="form-input" placeholder="name@example.com" required autofocus>
      </div>
      
      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" class="form-input" placeholder="••••••••" required>
      </div>

      <div class="options-row">
        <label class="checkbox-label" for="remember">
          <input type="checkbox" id="remember">
          Remember me
        </label>
        <a href="#" class="forgot-password">Forgot Password?</a>
      </div>

      <button type="submit" class="btn">Log In</button>
    </form>

    <div class="footer">
      Don't have an account? <a href="signup.html">Sign Up</a>
    </div>
  </div>
</body>
</html>
