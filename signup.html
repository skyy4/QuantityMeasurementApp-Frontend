<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Quantity Measurement App</title>
  <meta name="description" content="Create an account on Quantity Measurement App to securely measure, convert, and manage your quantities with high precision.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📏</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container" id="signup-container">
    <div class="header">
      <div class="header-icon">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
        </svg>
      </div>
      <h1 class="title">Create Account</h1>
      <p class="subtitle">Join the Quantity Measurement App</p>
    </div>

    <!-- Measurement themed subtle decoration -->
    <div class="measurement-icon">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>

    <form id="signup-form">
      <div class="form-group">
        <label for="fullName" class="form-label">Full Name</label>
        <input type="text" id="fullName" class="form-input" placeholder="John Doe" required autofocus>
      </div>

      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" id="email" class="form-input" placeholder="name@example.com" required>
      </div>
      
      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" class="form-input" placeholder="••••••••" required minlength="8">
      </div>

      <div class="form-group">
        <label for="confirmPassword" class="form-label">Confirm Password</label>
        <input type="password" id="confirmPassword" class="form-input" placeholder="••••••••" required minlength="8">
      </div>

      <div class="options-row">
        <label class="checkbox-label" for="terms">
          <input type="checkbox" id="terms" required>
          I agree to the <a href="#" style="color: var(--primary); margin-left: 0.25rem;">Terms & Conditions</a>
        </label>
      </div>

      <button type="submit" class="btn">Sign Up</button>
    </form>

    <div class="footer">
      Already have an account? <a href="index.html">Log In</a>
    </div>
  </div>
</body>
</html>
